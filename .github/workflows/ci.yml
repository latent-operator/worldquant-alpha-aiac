name: Current AIAC checks
on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: current-aiac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current-application:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: offline-test-placeholder
      OPENAI_BASE_URL: http://127.0.0.1:1/v1
      BRAIN_EMAIL: ''
      BRAIN_PASSWORD: ''
      POSTGRES_PORT: '1'
      REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest backend/tests/unit -q --asyncio-mode=auto
      - run: python -m unittest ops.test_local integrations.aiac_mcp.test_client -q
      - run: python -m unittest discover -s backend/tests/bounded -q
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
        working-directory: frontend
