name: AIAC offline checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-ubuntu:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aiac_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: aiac_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiac_ci -d aiac_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_USER: aiac_ci
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aiac_ci
      BRAIN_EMAIL: ""
      BRAIN_PASSWORD: ""
      OPENAI_API_KEY: ""
      CREDENTIALS_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Offline preflight
        run: python scripts/preflight.py
      - name: Fresh and repeatable migrations
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini current --check

  offline-windows:
    runs-on: windows-latest
    env:
      BRAIN_EMAIL: ""
      BRAIN_PASSWORD: ""
      OPENAI_API_KEY: ""
      CREDENTIALS_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Offline preflight
        run: python scripts/preflight.py
