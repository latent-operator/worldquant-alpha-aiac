name: AIAC offline checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aiac_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: aiac_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiac_ci -d aiac_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_USER: aiac_ci
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aiac_ci
      BRAIN_EMAIL: ""
      BRAIN_PASSWORD: ""
      OPENAI_API_KEY: ""
      CREDENTIALS_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Reject runtime files and recognizable credentials
        run: python scripts/check_repo_hygiene.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline unit tests
        env:
          POSTGRES_PORT: "1"
          REDIS_URL: redis://127.0.0.1:1/0
        run: python -m pytest backend/tests/unit -q --disable-warnings
      - name: Fresh database migrations
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -c "import os, psycopg2; c=psycopg2.connect(host=os.environ['POSTGRES_SERVER'], port=os.environ['POSTGRES_PORT'], user=os.environ['POSTGRES_USER'], password=os.environ['POSTGRES_PASSWORD'], dbname=os.environ['POSTGRES_DB']); v=c.cursor(); v.execute('SELECT version_num FROM alembic_version'); assert v.fetchone()[0] == '0002_llm_wait_checkpoint'; c.close()"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint source
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
