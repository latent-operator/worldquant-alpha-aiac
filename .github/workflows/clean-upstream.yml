name: Pinned clean upstream checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aiac_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: aiac_bounded_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aiac_ci" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      POSTGRES_PORT: '1'
      REDIS_URL: redis://127.0.0.1:1/0
      BRAIN_EMAIL: ''
      BRAIN_PASSWORD: ''
      OPENAI_API_KEY: offline-test-placeholder
      OPENAI_BASE_URL: http://127.0.0.1:1/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lavender1203/worldquant-alpha-aiac
          ref: 8ffda431d08703b7f6ae13c8287806fd76eb63e0
          path: upstream-check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r upstream-check/requirements.txt pytest-mock
      - run: python scripts/verify_clean_upstream.py --source upstream-check
      - run: python -m scripts.build_clean_runtime --source upstream-check --target bounded-check
      - run: python -m scripts.test_clean_runtime --source bounded-check
        env:
          POSTGRES_USER: aiac_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_SERVER: 127.0.0.1
          POSTGRES_PORT: '5432'
      - run: npm ci && npm run build
        working-directory: bounded-check/frontend
